services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      headhunt_internal:
        aliases:
          - redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50

volumes:
  redis_data:

networks:
  headhunt_internal:
    name: ${SHARED_NETWORK:-headhunt_internal}
    external: true
