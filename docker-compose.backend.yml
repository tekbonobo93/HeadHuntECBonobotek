services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      SERVE_FRONTEND: "false"
      TRUST_PROXY: "true"
      APP_URL: ${APP_URL:-http://localhost:3100}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@ejemplo.com}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/headhunt}
      PGSSL: ${PGSSL:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AUTH_RATE_LIMIT_STRATEGY: ${AUTH_RATE_LIMIT_STRATEGY:-redis}
      SMTP_HOST: ${SMTP_HOST:-smtp.local.test}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-local-smtp-user}
      SMTP_PASS: ${SMTP_PASS:-local-smtp-pass}
      SMTP_FROM: ${SMTP_FROM:-TalentoMatch IA <no-reply@local.test>}
      AUTH_PREVIEW_LINKS: ${AUTH_PREVIEW_LINKS:-false}
      APP_STATE_USER_ID: ${APP_STATE_USER_ID:-default}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    networks:
      headhunt_internal:
        aliases:
          - backend
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.00

networks:
  headhunt_internal:
    name: ${SHARED_NETWORK:-headhunt_internal}
    external: true
